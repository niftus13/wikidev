services:
  web:
    image: wikiblog-dev:local
    build:
      context: .
    command: pnpm --filter @wikiblog/web dev --host 0.0.0.0
    environment:
      API_PROXY_TARGET: http://api:4000
      NUXT_API_PROXY_TIMEOUT_MS: ${NUXT_API_PROXY_TIMEOUT_MS:-30000}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      # 웹은 API와 전용 네트워크에서 고정 주소로만 통신한다. API는 이 주소만 프록시로 신뢰한다(TRUST_PROXY).
      web-api:
        ipv4_address: ${WEB_PROXY_IP:-10.231.0.6}
    volumes:
      - ./apps/web/app:/app/apps/web/app
    depends_on:
      api:
        condition: service_healthy

  api:
    image: wikiblog-dev:local
    build:
      context: .
    command: sh -c "pnpm --filter @wikiblog/api migrate && exec pnpm --filter @wikiblog/api dev"
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      MYSQL_HOST: mysql
      MYSQL_DATABASE: wikiblog
      MYSQL_USER: wikiblog
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      REDIS_URL: redis://redis:6379
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      # 웹 컨테이너 주소 하나만 신뢰한다. 다른 주소에서 온 X-Forwarded-For는 무시된다.
      TRUST_PROXY: ${WEB_PROXY_IP:-10.231.0.6}
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - default
      - web-api
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/migrations:/app/apps/api/migrations
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wikiblog
      MYSQL_USER: wikiblog
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  default:
  web-api:
    ipam:
      config:
        # 같은 호스트에서 다른 Compose 프로젝트(예: worktree)와 함께 띄우면 .env에서 겹치지 않는 값으로 바꾼다.
        # WEB_PROXY_IP는 이 대역의 마지막 주소로 둔다. API는 앞쪽 주소를 자동으로 받으므로 충돌하지 않는다.
        - subnet: ${WEB_API_SUBNET:-10.231.0.0/29}

volumes:
  mysql-data:
