services:
  web:
    image: wikiblog-dev:local
    build:
      context: .
    command: pnpm --filter @wikiblog/web dev --host 0.0.0.0
    environment:
      API_PROXY_TARGET: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web/app:/app/apps/web/app
    depends_on:
      api:
        condition: service_healthy

  api:
    image: wikiblog-dev:local
    build:
      context: .
    command: pnpm --filter @wikiblog/api dev
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      MYSQL_HOST: mysql
      MYSQL_DATABASE: wikiblog
      MYSQL_USER: wikiblog
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wikiblog
      MYSQL_USER: wikiblog
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
