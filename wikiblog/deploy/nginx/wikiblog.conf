# WikiBlog 호스트 nginx (첫 hop). 런북: deploy/README.md
# 설치: <도메인>을 실제 도메인으로 바꿔 /etc/nginx/sites-available/wikiblog로 두고 sites-enabled에 링크한다.
#   sudo sed 's/<도메인>/example.com/g' deploy/nginx/wikiblog.conf | sudo tee /etc/nginx/sites-available/wikiblog > /dev/null
#   sudo ln -s /etc/nginx/sites-available/wikiblog /etc/nginx/sites-enabled/wikiblog && sudo nginx -t && sudo systemctl reload nginx
# 첫 인증서 발급 전에는 443 server의 인증서 파일이 없어 nginx -t가 실패한다. 런북 "인증서"의 순서를 따른다.
#
# 클라이언트 IP: CDN이 없으므로 nginx가 첫 hop이고 $remote_addr가 곧 클라이언트 주소다.
# upstream에는 X-Forwarded-For를 $remote_addr 하나로 덮어쓴다($proxy_add_x_forwarded_for 금지 — 위조 값이 남는다).
# 웹은 Docker 게이트웨이(NUXT_WEB_TRUST_PROXY)에서 온 연결만 이 값을 믿는다.

upstream wikiblog_web {
    # 웹 컨테이너 공개 포트(loopback 전용, compose.prod.yaml WEB_HOST_PORT).
    server 127.0.0.1:3000;
    keepalive 16;
}

# 알 수 없는 Host(IP 직접 접속, 다른 도메인)는 응답하지 않는다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# 80: 인증서 갱신(HTTP-01)과 HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name <도메인>;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        # certbot --webroot -w /var/www/certbot
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://<도메인>$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <도메인>;
    server_tokens off;

    # Let's Encrypt(certbot) 경로. 갱신 후 재적재는 certbot deploy hook(런북 "인증서")이 한다.
    ssl_certificate /etc/letsencrypt/live/<도메인>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<도메인>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:wikiblog_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS. 하위 도메인 전체가 HTTPS로 준비되기 전에는 includeSubDomains·preload를 붙이지 않는다.
    # add_header는 location에서 add_header를 쓰면 상속되지 않으므로 /_nuxt/에도 같은 줄을 둔다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 요청 본문 상한: API JSON 상한(16KB)보다 여유 있게. 이미지 업로드만 아래 location에서 3m.
    client_max_body_size 64k;

    # 시간 제한: 웹 /api 프록시 30초(504)보다 길게 두어 웹의 504가 그대로 전달되게 한다.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # upstream 요청 헤더. location에서 proxy_set_header를 쓰면 이 목록이 상속되지 않으므로 location에는 두지 않는다.
    # Origin·Cookie·X-CSRF-Token·Content-Type 등 나머지 요청 헤더는 nginx가 그대로 전달한다.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # 클라이언트가 보낸 다른 주소 헤더는 지운다(빈 값이면 nginx가 헤더를 보내지 않는다).
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";

    # 이미지 업로드(원본 바이트). API 상한 2 MiB보다 크게 두어 상한 초과가 API의 JSON 413으로 응답되게 한다.
    location = /api/v1/me/images {
        client_max_body_size 3m;
        proxy_pass http://wikiblog_web;
    }

    # 해시 파일명 정적 자산만 길게 캐시한다. 그 밖의 경로는 캐시하지 않고 캐시 헤더도 추가하지 않는다
    # (API는 no-store, 이미지 조회는 API가 정한 헤더를 그대로 쓴다).
    location ^~ /_nuxt/ {
        proxy_pass http://wikiblog_web;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        proxy_pass http://wikiblog_web;
    }
}
