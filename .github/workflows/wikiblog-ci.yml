# WikiBlog CI. Git 루트는 wikis/이고 GitHub은 루트의 .github/workflows만 읽으므로 이 파일은 루트에 둔다.
# 모든 명령은 wikiblog/ 에서 실행한다. 요구사항: wikiblog/docs/checkpoints/ops-ci.md
name: wikiblog-ci

on:
  pull_request:
    paths:
      - "wikiblog/**"
      - ".github/workflows/wikiblog-ci.yml"
  push:
    branches: [main]
    paths:
      - "wikiblog/**"
      - ".github/workflows/wikiblog-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wikiblog-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # shell: bash를 명시해야 GitHub이 -eo pipefail로 실행한다(파이프 앞 명령의 실패를 놓치지 않는다).
    shell: bash
    working-directory: wikiblog

jobs:
  static-unit:
    name: 정적 검사·단위 테스트
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          # 버전은 wikiblog/package.json의 packageManager(pnpm@10.30.0)를 따른다.
          package_json_file: wikiblog/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: wikiblog/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared libraries
        run: pnpm build:libs
      - name: Typecheck API
        run: pnpm typecheck
      - name: Typecheck web
        run: pnpm --filter @wikiblog/web typecheck
      - name: Build API
        run: pnpm --filter @wikiblog/api build
      - name: API unit tests (integration tests are skipped here)
        run: pnpm --filter @wikiblog/api test
      - name: Web unit tests
        run: pnpm --filter @wikiblog/web test
      - name: Build web
        run: pnpm --filter @wikiblog/web build

  integration:
    name: 통합 테스트 (MySQL·Redis·API)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: wikiblog
      MYSQL_USER: wikiblog
      REDIS_URL: redis://127.0.0.1:6379
      HOST: 127.0.0.1
      PORT: "4000"
      APP_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      # TRUST_PROXY는 설정하지 않는다(직접 연결 주소로 요청 제한을 집계).
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: wikiblog/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: wikiblog/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared libraries
        run: pnpm build:libs
      # 서비스 컨테이너의 env는 job 시작 전에 정해지므로 job 안에서 만든 비밀번호를 넘길 수 없다.
      # 그래서 MySQL만 이 step에서 일회용 비밀번호로 직접 띄우고, 러너의 loopback에만 포트를 연다.
      - name: Start MySQL 8.4 with one-time passwords
        run: |
          app_password="$(openssl rand -hex 24)"
          root_password="$(openssl rand -hex 24)"
          echo "::add-mask::${app_password}"
          echo "::add-mask::${root_password}"
          echo "MYSQL_PASSWORD=${app_password}" >> "$GITHUB_ENV"
          MYSQL_PASSWORD="$app_password" MYSQL_ROOT_PASSWORD="$root_password" docker run --detach \
            --name wikiblog-ci-mysql \
            --publish 127.0.0.1:3306:3306 \
            --env MYSQL_DATABASE --env MYSQL_USER --env MYSQL_PASSWORD --env MYSQL_ROOT_PASSWORD \
            --health-cmd 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent' \
            --health-interval 2s --health-timeout 5s --health-retries 60 \
            mysql:8.4 > /dev/null
      - name: Wait for MySQL
        run: |
          # 초기화 중 임시 서버는 TCP를 열지 않으므로 127.0.0.1 ping이 성공하면 최종 서버가 준비된 것이다.
          deadline=$((SECONDS + 120))
          until [ "$(docker inspect --format '{{.State.Health.Status}}' wikiblog-ci-mysql)" = healthy ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::MySQL did not become healthy within 120 seconds"
              docker logs wikiblog-ci-mysql
              exit 1
            fi
            sleep 2
          done
          echo "MySQL is healthy"
      - name: Apply migrations
        run: pnpm --filter @wikiblog/api migrate
      - name: Start API in background
        run: |
          cd apps/api
          nohup node src/index.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
      - name: Wait for API health
        run: |
          deadline=$((SECONDS + 60))
          until curl --silent --fail --max-time 2 http://127.0.0.1:4000/api/health | grep -q '"status":"ok"'; do
            if ! kill -0 "$API_PID" 2> /dev/null; then
              echo "::error::API process exited before becoming healthy"
              cat "$RUNNER_TEMP/api.log"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::API /api/health was not ok within 60 seconds"
              cat "$RUNNER_TEMP/api.log"
              exit 1
            fi
            sleep 1
          done
          echo "API is healthy"
      - name: API tests with INTEGRATION_TESTS=1 (no skipped tests allowed)
        run: |
          log="$RUNNER_TEMP/api-test.log"
          INTEGRATION_TESTS=1 NO_COLOR=1 pnpm --filter @wikiblog/api test 2>&1 | tee "$log"
          # node --test의 기본(spec) reporter는 끝에 "ℹ tests N", "ℹ skipped N" 요약 줄을 한 번씩 출력한다.
          # 요약을 찾지 못하거나 skipped가 0이 아니면 실패한다(환경 변수 누락으로 통합 테스트가 조용히 건너뛰는 것을 막는다).
          summary="$(sed -E 's/\x1b\[[0-9;]*m//g' "$log")"
          tests="$(printf '%s\n' "$summary" | sed -nE 's/^ℹ tests ([0-9]+)$/\1/p')"
          skipped="$(printf '%s\n' "$summary" | sed -nE 's/^ℹ skipped ([0-9]+)$/\1/p')"
          if [ "$(printf '%s' "$tests" | grep -c .)" -ne 1 ] || [ "$(printf '%s' "$skipped" | grep -c .)" -ne 1 ]; then
            echo "::error::Could not find exactly one node --test summary (tests/skipped) in the output"
            exit 1
          fi
          if [ "$tests" -eq 0 ]; then
            echo "::error::No tests were run"
            exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "::error::${skipped} test(s) were skipped; integration CI requires 0 skipped tests"
            exit 1
          fi
          echo "tests=${tests} skipped=${skipped}"
      - name: Show API log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" 2> /dev/null || echo "No API log"
      - name: Stop API and MySQL
        if: always()
        run: |
          if [ -n "${API_PID:-}" ]; then kill "$API_PID" 2> /dev/null || true; fi
          docker rm --force --volumes wikiblog-ci-mysql > /dev/null 2>&1 || true

  production-image:
    name: 운영 이미지 빌드·실행 스모크
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: wikiblog-ci
      WIKIBLOG_IMAGE: wikiblog-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # 레지스트리 push는 하지 않는다. 운영과 같은 compose.prod.yaml·deploy.sh로 빌드 → 마이그레이션 → 기동 → 헬스 체크를 한다.
      - name: Write one-time production environment file
        run: |
          env_file="$RUNNER_TEMP/wikiblog-ci.env"
          echo "WIKIBLOG_ENV_FILE=${env_file}" >> "$GITHUB_ENV"
          app_password="$(openssl rand -hex 24)"
          root_password="$(openssl rand -hex 24)"
          echo "::add-mask::${app_password}"
          echo "::add-mask::${root_password}"
          umask 077
          {
            echo "APP_DOMAIN=ci.wikiblog.invalid"
            echo "MYSQL_PASSWORD=${app_password}"
            echo "MYSQL_ROOT_PASSWORD=${root_password}"
            echo "WIKIBLOG_IMAGE=${WIKIBLOG_IMAGE}"
          } > "$env_file"
      - name: Build production images and start the stack with deploy.sh
        env:
          WIKIBLOG_DEPLOY_NO_CHECKOUT: "1"
        run: deploy/deploy.sh "ci-${GITHUB_SHA::12}"
      - name: Smoke test the production build through the published port
        run: |
          base=http://127.0.0.1:3000
          check() {
            local path="$1" expected="$2" status
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$base$path")"
            echo "$path -> $status"
            if [ "$status" != "$expected" ]; then
              echo "::error::$path returned $status (expected $expected)"
              return 1
            fi
          }
          # 운영 빌드 SSR(아이콘이 있는 화면 포함, 지난 @lucide/vue SSR 500 같은 결함을 잡는다)
          check / 200
          check /login 200
          check /register 200
          check /search 200
          check /dashboard/books 200
          check /@nobody 404
          check /api/health 200
          asset="$(curl --silent --fail "$base/" | grep -oE '/_nuxt/[A-Za-z0-9._-]+\.(js|css)' | head -n 1)"
          if [ -z "$asset" ]; then
            echo "::error::No /_nuxt asset found in the home page HTML"
            exit 1
          fi
          check "$asset" 200
          # 운영 포트는 loopback 3000에만 공개되고 API·MySQL·Redis는 공개되지 않는다.
          docker ps --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" --format '{{.Names}} {{.Ports}}'
          if docker ps --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" --format '{{.Ports}}' | grep -E '0\.0\.0\.0|:::|->4000|->3306|->6379'; then
            echo "::error::A production port is published beyond 127.0.0.1:3000"
            exit 1
          fi
      - name: Show production logs on failure
        if: failure()
        env:
          WIKIBLOG_TAG: unused
        run: docker compose -p "$COMPOSE_PROJECT_NAME" --env-file "$WIKIBLOG_ENV_FILE" -f compose.prod.yaml logs --no-color --tail 200 || true
      - name: Remove the production stack
        if: always()
        env:
          WIKIBLOG_TAG: unused
        run: docker compose -p "$COMPOSE_PROJECT_NAME" --env-file "$WIKIBLOG_ENV_FILE" -f compose.prod.yaml down --volumes --remove-orphans || true
